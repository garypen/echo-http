[package]
name = "echo-http"
version = "0.1.0"
edition = "2024"

[dependencies]
hyper = { version = "1.10", features = ["full"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
rustls = { version = "0.23.41", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1.52", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
hyper-tungstenite = "0.30.0"
futures-util = "0.3.34"
